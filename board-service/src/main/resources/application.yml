server:
  port: 8081

spring:
  datasource:
    # DB 연결 주소 (로컬호스트:3307 포트의 user-db 데이터베이스)
    url: jdbc:mysql://localhost:3308/board-db # DB 주소
    username: root # DB 계정
    password: password # DB 비밀번호
    # MySQL JDBC 드라이버 클래스 지정
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 애플리케이션 실행 시 엔티티 기준으로 테이블 자동 생성/수정
      # update: 기존 테이블 유지하면서 변경사항만 반영
      ddl-auto: update
    # 실행되는 SQL 쿼리를 콘솔에 출력 (디버깅용)
    show-sql: true

client:
  user-service:
    url: http://localhost:8080
# 주요 설정 설명:
# ddl-auto: update - 개발 중에는 편하지만, 운영 환경에서는 validate나 none 사용 권장
# show-sql: true - SQL 로그 확인으로 쿼리 최적화에 도움
# 포트 3307 사용 - 기본 MySQL 포트(3306)와 다른 것으로 보아 Docker나 별도 인스턴스 사용중
